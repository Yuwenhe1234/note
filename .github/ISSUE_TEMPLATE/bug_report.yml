name: Bug 报告
description: 报告一个缺陷或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢你花时间报告问题。请尽量提供以下信息,帮助我们复现。"
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么?期望是什么?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步一步说明如何复现。
      placeholder: "1. 打开…\n2. 点击…\n3. 看到…"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境信息
      description: 浏览器 / 系统 / Node 版本,例如 Chrome 128 + Windows 11 + Node 22
  - type: textarea
    id: logs
    attributes:
      label: 相关日志或截图
      description: 控制台报错、`npm run dev` 输出或截图。
